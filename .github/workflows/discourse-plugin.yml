name: Discourse Plugin

on:
  push:
    branches:
      - main
  pull_request:
  # Weekly run against the latest Discourse, to catch upstream changes that
  # break this plugin even when this repo hasn't changed (e.g. the Aug 2026
  # discourse-calendar -> discourse-events rename).
  schedule:
    - cron: "0 9 * * 1" # Mondays 09:00 UTC
  workflow_dispatch:

jobs:
  ci:
    uses: discourse/.github/.github/workflows/discourse-plugin.yml@v1

  # GitHub disables scheduled workflows after 60 days without repository
  # activity. Re-enabling the workflow through the API on each scheduled run
  # keeps the weekly schedule from lapsing.
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/discourse-plugin.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
